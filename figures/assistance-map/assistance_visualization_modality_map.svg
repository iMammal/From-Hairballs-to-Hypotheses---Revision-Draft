<title id="title">Assistance by visualization modality map</title>
<desc id="desc">A four by five matrix of representative assessed life-science systems. Rows are Algorithmic, Adaptive, Conversational, and Immersive assistance. Columns are Desktop or Planar, Large Display, VR, AR or MR, and CAVE. Empty cells mean not represented in the assessed examples.</desc>
